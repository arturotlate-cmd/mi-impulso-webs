<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Impulso Web</title>
</head>
<body>

<h1>🔥 Mi Impulso Web con Firebase</h1>

<button onclick="loginGoogle()">Login con Google</button>
<button onclick="logout()">Cerrar sesión</button>

<br><br>

<input id="mensaje" placeholder="Escribe un mensaje">
<button onclick="guardar()">Guardar mensaje</button>

<h2>Mensajes:</h2>
<ul id="lista"></ul>

<script type="module">
// FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDS6GpjjaHOfooH6d5SgPQ8PNSReRWc8pI",
  authDomain: "mi-impulso-web.firebaseapp.com",
  projectId: "mi-impulso-web",
  storageBucket: "mi-impulso-web.appspot.com",
  messagingSenderId: "1088637074350",
  appId: "1:1088637074350:web:f2f67695cdfd9432a7e63f"
};

// INICIAR
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// LOGIN GOOGLE
window.loginGoogle = async () => {
  const result = await signInWithPopup(auth, provider);
  alert("Bienvenido " + result.user.displayName);
};

// LOGOUT
window.logout = async () => {
  await signOut(auth);
  alert("Sesión cerrada");
};

// GUARDAR MENSAJE
window.guardar = async () => {
  const texto = document.getElementById("mensaje").value;
  if (!texto) return alert("Escribe algo");

  await addDoc(collection(db, "mensajes"), {
    texto: texto,
    fecha: new Date()
  });

  document.getElementById("mensaje").value = "";
};

// LEER MENSAJES EN TIEMPO REAL
const q = query(collection(db, "mensajes"), orderBy("fecha"));
onSnapshot(q, (snapshot) => {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  snapshot.forEach(doc => {
    const li = document.createElement("li");
    li.textContent = doc.data().texto;
    lista.appendChild(li);
  });
});

// VER USUARIO
onAuthStateChanged(auth, (user) => {
  if (user) {
    console.log("Usuario conectado:", user.email);
  } else {
    console.log("No hay usuario");
  }
});
</script>

</body>
</html>
