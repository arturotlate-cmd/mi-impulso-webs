<!DOCTYPE html>
<html lang="es">
<head>

<body>

<div class="container">

  <h1>🚀 Mi Impulso Webs</h1>
  <p>Guardar mensaje en la nube (Firebase)</p>

  <div class="form">
    <input id="nombre" placeholder="Tu nombre">
    <input id="mensaje" placeholder="Tu mensaje">
    <button id="btnEnviar">Enviar</button>
  </div>

  <h3>📩 Mensajes guardados:</h3>
  <ul id="listaMensajes"></ul>

</div>

 <!-- Firebase SDK -->
  <script type="module">
    // 🔥 IMPORTANTE: Aquí pega tu configuración de Firebase
    import { initializeApp } from "firebase/app";
    mport { getAnalytics } from "firebase/analytics";

    const firebaseConfig = {
      apiKey: "AIzaSyDS6GpjjaHOfooH6d5SgPQ8PNSReRWc8pI",
      authDomain: "mi-impulso-web.firebaseapp.com",
      databaseURL: "https://TU_PROYECTO.firebaseio.com",
      projectId: "mi-impulso-web",
      storageBucket: "mi-impulso-web.firebasestorage.app",
      messagingSenderId: "1088637074350",
      appId: "1:1088637074350:web:f2f67695cdfd9432a7e63f"
      measurementId: "G-8EH7DS6XHL"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);

// Guardar mensaje
window.guardarMensaje = async function () {
  const nombre = document.getElementById("nombre").value;
  const mensaje = document.getElementById("mensaje").value;

  if (!nombre || !mensaje) {
    alert("Escribe tu nombre y mensaje");
    return;
  }

  await addDoc(collection(db, "mensajes"), {
    nombre,
    mensaje,
    fecha: new Date()
  });

  document.getElementById("mensaje").value = "";
};

// Mostrar mensajes en tiempo real
const lista = document.getElementById("listaMensajes");

onSnapshot(collection(db, "mensajes"), (snapshot) => {
  lista.innerHTML = "";
  snapshot.forEach(doc => {
    const data = doc.data();
    const li = document.createElement("li");
    li.textContent = data.nombre + ": " + data.mensaje;
    lista.appendChild(li);
  });
});

// Botón
document.getElementById("btnEnviar").addEventListener("click", guardarMensaje);
</script>

</body>
