<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Impulso Web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0f2c">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="loader">Cargando plataforma...</div>

<header>
  <h1>Mi Impulso Web</h1>
  <nav>
    <button onclick="showSection('market', this)" class="active">Marketplace</button>
    <button onclick="showSection('sell', this)">Vender</button>
    <button onclick="showSection('about', this)">Acerca</button>
  </nav>
</header>

<!-- ===== MARKETPLACE ===== -->
<section id="market" class="visible">

  <div class="filters">
    <input type="text" id="search" placeholder="Buscar...">
    <select id="category">
      <option value="">Todas</option>
      <option value="producto">Productos</option>
      <option value="servicio">Servicios</option>
    </select>
  </div>

  <div id="products"></div>

</section>

<!-- ===== VENDER ===== -->
<section id="sell" class="hidden">

  <h2>Publicar producto o servicio</h2>

  <form id="sellForm">
    <input id="pName" placeholder="Nombre del producto" required>
    <input id="pDesc" placeholder="Descripción" required>
    <input id="pPrice" type="number" placeholder="Precio" required>
    
    <select id="pCat">
      <option value="producto">Producto</option>
      <option value="servicio">Servicio</option>
    </select>

    <button type="submit">Publicar</button>
  </form>

</section>

<!-- ===== ABOUT ===== -->
<section id="about" class="hidden">
  <h2>Mi Impulso Web</h2>
  <p>Una plataforma creada por Arturo para vender productos y servicios online.</p>
</section>

<script src="script.js"></script>
</body>
</html>
