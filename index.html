<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>IMOULSO</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: white;
  text-align: center;
  padding: 30px;
}

.container {
  background: white;
  color: black;
  max-width: 500px;
  margin: auto;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h1 {
  color: #525252;
}

button {
  background: #a3581d;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  margin: 5px;
}

button:hover {
  background: #d98c27;
}

input {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  width: 70%;
}

#lista {
  text-align: left;
  margin-top: 10px;
}

#lista li {
  background: #f1f1f1;
  padding: 8px;
  margin: 5px 0;
  border-radius: 8px;
}
</style>

</head>
<body>

<div class="container">
<h1>🔥 Mi Impulso Web</h1>

<button onclick="loginGoogle()">Login con Google</button>
<button onclick="logout()">Cerrar sesión</button>

<br><br>

<input id="mensaje" placeholder="Escribe un mensaje">
<button onclick="guardar()">Enviar</button>

<h2>💬 Chat en vivo</h2>
<ul id="lista"></ul>
</div>

<script type="module">
// FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDS6GpjjaHOfooH6d5SgPQ8PNSReRWc8pI",
  authDomain: "mi-impulso-web.firebaseapp.com",
  projectId: "mi-impulso-web",
  storageBucket: "mi-impulso-web.appspot.com",
  messagingSenderId: "1088637074350",
  appId: "1:1088637074350:web:f2f67695cdfd9432a7e63f"
};

// INICIAR
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let usuario = null;

// LOGIN
window.loginGoogle = async () => {
  const result = await signInWithPopup(auth, provider);
  usuario = result.user;
  alert("Bienvenido " + usuario.displayName);
};

// LOGOUT
window.logout = async () => {
  await signOut(auth);
  alert("Sesión cerrada");
};

// GUARDAR MENSAJE
window.guardar = async () => {
  const texto = document.getElementById("mensaje").value;
  if (!texto) return;

  await addDoc(collection(db, "mensajes"), {
    texto: texto,
    user: usuario ? usuario.displayName : "Anonimo",
    fecha: new Date()
  });

  document.getElementById("mensaje").value = "";
};

// LEER CHAT
const q = query(collection(db, "mensajes"), orderBy("fecha"));
onSnapshot(q, (snapshot) => {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  snapshot.forEach(doc => {
    const d = doc.data();
    const li = document.createElement("li");
    li.innerHTML = `<b>${d.user}:</b> ${d.texto}`;
    lista.appendChild(li);
  });
});
</script>

</body>
</html>
