<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chat Privado Firestore</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h2>🔥 Chat privado Firestore</h2>

<button id="loginGoogle">Login Google</button>
<button id="logout">Salir</button>

<p id="user"></p>

<div id="chat" style="display:none;">
  <input id="msg" placeholder="Escribe mensaje">
  <button id="send">Enviar</button>
  <div id="messages"></div>
</div>

<script type="module">
  
<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

// 🔥 TU CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDS6GpjjaHOfooH6d5SgPQ8PNSReRWc8pI",
  authDomain: "mi-impulso-web.firebaseapp.com",
  projectId: "mi-impulso-web",
  storageBucket: "mi-impulso-web.appspot.com",
  messagingSenderId: "1088637074350",
  appId: "1:1088637074350:web:f2f67695cdfd9432a7e63f"
};

// INIT
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let currentChatProduct = null;

// ================= LOGIN =================
const provider = new GoogleAuthProvider();

document.getElementById("loginGoogle").onclick = () => {
  signInWithPopup(auth, provider);
};

document.getElementById("logout").onclick = () => signOut(auth);

// ================= USUARIO =================
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("user").innerText = "Usuario: " + user.displayName;
    document.getElementById("chat").style.display = "block";
    loadMessages(user.uid);
  } else {
    document.getElementById("chat").style.display = "none";
  }
});

// ================= ENVIAR MENSAJE PRIVADO =================
document.getElementById("send").onclick = async () => {
  const user = auth.currentUser;
  const msg = document.getElementById("msg").value;
  if (!user || !msg) return;

  await addDoc(collection(db, "privateChat", user.uid, "messages"), {
    name: user.displayName,
    uid: user.uid,
    text: msg,
    time: Date.now()
  });

  document.getElementById("msg").value = "";
};

// ================= LEER MENSAJES PRIVADOS =================
function loadMessages(uid) {
  const q = query(collection(db, "privateChat", uid, "messages"), orderBy("time"));

  onSnapshot(q, (snap) => {
    document.getElementById("messages").innerHTML = "";
    snap.forEach(doc => {
      const m = doc.data();
      document.getElementById("messages").innerHTML += `<p><b>${m.name}:</b> ${m.text}</p>`;
    });
  });
}
</script>

</body>
</html>
