<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMPULSO - Plataforma de Emprendimiento</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <img src="logo-impulso.png.png" alt="Impulso">
  <nav>
    <button onclick="showSection('market')">Inicio</button>
    <button onclick="showSection('sell')">Vender</button>
    <button onclick="showSection('about')">Acerca</button>
  </nav>
</header>

<main>

  <section class="hero fade-in">
    <h1>Impulsa tu proyecto</h1>
    <p>Soluciones reales para crecer</p>
  </section>

  <section id="market" class="grid fade-in">
    <div class="card">
      <h2>Filtros</h2>
      <label>Buscar</label>
      <input id="search" placeholder="Producto..." oninput="renderProducts()">

      <label>Categoría</label>
      <select id="category" onchange="renderProducts()">
        <option value="">Todas</option>
        <option value="servicio">Servicio</option>
        <option value="producto">Producto</option>
      </select>
    </div>

    <div class="card">
      <h2>Productos</h2>
      <div id="products" class="products"></div>
    </div>
  </section>

  <section id="sell" class="card fade-in hidden">
    <h2>Quiero vender</h2>
    <form>
      <input placeholder="Nombre" required>
      <input type="email" placeholder="Correo" required>
      <input placeholder="Producto / Servicio" required>
      <input type="number" placeholder="Precio" required>
      <textarea placeholder="Descripción" rows="4" required></textarea>
      <button class="primary">Enviar</button>
    </form>
  </section>

  <section id="about" class="card fade-in hidden">
    <h2>Acerca del proyecto</h2>
    <p>Marketplace frontend de demostración para validar ideas.</p>
  </section>

</main>

<footer>
  © 2026 IMPULSO
</footer>

<!-- JS -->
<script src="script.js"></script>
</body>
</html>
