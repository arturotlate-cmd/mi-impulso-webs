<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>IMPULSO | Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>IMPULSO</h1>
      <h2>Compra y vende en tiempo real</h2>
    </header>

    <section>
      <button id="btnLogin">Iniciar sesión</button>
      <button id="btnLogout" style="display:none;">Cerrar sesión</button>
      <a href="perfil.html">Mi perfil</a>
    </section>

    <hr>

    <h3>Publicar producto</h3>

    <input id="titulo" placeholder="Título del producto">
    <input id="precio" type="number" placeholder="Precio">
    <textarea id="descripcion" placeholder="Descripción"></textarea>
    <button id="btnPublicar">Publicar</button>

    <hr>

    <h3>Productos</h3>
    <ul id="productos"></ul>
  </div>

  <script type="module" src="app.js"></script>
  <script type="module" src="products.js"></script>
</body>
</html>
