<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Impulso Web</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <h1>Mi Impulso Web 🚀</h1>

  <button id="loginBtn">Iniciar sesión con Google</button>
  <button id="logoutBtn" style="display:none;">Cerrar sesión</button>

  <p id="userInfo"></p>
</header>

<!-- PUBLICAR -->
<section id="sell">
<h2>Publicar producto</h2>

<input id="pName" placeholder="Nombre">
<input id="pDesc" placeholder="Descripción">
<input id="pPrice" type="number" placeholder="Precio">
<input type="file" id="pImage">

<button id="publishBtn">Publicar</button>
</section>

<!-- MARKETPLACE -->
<section>
<h2>Marketplace</h2>
<div id="products"></div>
</section>

<!-- CHAT PRIVADO -->
<section id="privateChat" style="display:none;">
  <h2>Chat con vendedor</h2>
  <div id="privateChatBox"></div>
  <input id="privateMsg" placeholder="Mensaje...">
  <button id="sendPrivate">Enviar</button>
</section>

<!-- Firebase -->
<script type="module">

// 🔥 IMPORTS FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

// 🔥 TU CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDS6GpjjaHOfooH6d5SgPQ8PNSReRWc8pI",
  authDomain: "mi-impulso-web.firebaseapp.com",
  projectId: "mi-impulso-web",
  storageBucket: "mi-impulso-web.appspot.com",
  messagingSenderId: "1088637074350",
  appId: "1:1088637074350:web:f2f67695cdfd9432a7e63f"
};

// INIT
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const db = getFirestore(app);
const storage = getStorage(app);

let currentUser = null;

// ================= LOGIN =================
loginBtn.onclick = async () => {
  const result = await signInWithPopup(auth, provider);
  currentUser = result.user;
  userInfo.innerText = "Hola " + currentUser.displayName;
  loginBtn.style.display = "none";
  logoutBtn.style.display = "inline";
};

logoutBtn.onclick = () => {
  signOut(auth);
  location.reload();
};

// ================= PUBLICAR PRODUCTO =================
publishBtn.onclick = async () => {
  if (!currentUser) return alert("Inicia sesión");

  const name = pName.value;
  const desc = pDesc.value;
  const price = pPrice.value;
  const file = pImage.files[0];

  const imgRef = ref(storage, "products/" + Date.now());
  await uploadBytes(imgRef, file);
  const imgURL = await getDownloadURL(imgRef);

  await addDoc(collection(db, "products"), {
    name, desc, price, imgURL,
    user: currentUser.displayName
  });

  alert("Producto publicado");
};

// ================= MOSTRAR PRODUCTOS =================
onSnapshot(collection(db, "products"), (snap) => {
  products.innerHTML = "";
  snap.forEach(doc => {
    const p = doc.data();
    products.innerHTML += `
    <div class="product">
      <img src="${p.imgURL}" width="150">
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <b>$${p.price}</b>
      <p>Vendedor: ${p.user}</p>
      <button onclick="openChat('${doc.id}')">Contactar vendedor</button>
    </div>
    `;
  });
});

// ================= CHAT PRIVADO =================
let currentChatProduct = null;

window.openChat = (id) => {
  if (!currentUser) return alert("Inicia sesión");
  currentChatProduct = id;
  privateChat.style.display = "block";
};

sendPrivate.onclick = async () => {
  await addDoc(collection(db, "chats", currentChatProduct, "messages"), {
    user: currentUser.displayName,
    msg: privateMsg.value,
    time: Date.now()
  });
  privateMsg.value = "";
};

onSnapshot(collection(db, "chats"), () => {});

</script>

</body>
</html>
