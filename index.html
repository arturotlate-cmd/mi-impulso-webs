<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMPULSO - Plataforma de Emprendimiento</title>

  <style>
    :root {
      --blue:#1E3A8A;
      --dark:#111827;
      --green:#22C55E;
      --bg:#f3f4f6;
      --card:#ffffff;
    }

    * { box-sizing: border-box }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu;
      background: var(--bg);
      color: var(--dark);
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, var(--blue), #0f2a5f);
      color: white;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    header img {
      max-width: 180px;
      margin-bottom: 12px;
    }

    nav {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    nav button {
      background: white;
      color: var(--blue);
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    nav button:hover {
      background: var(--green);
      color: white;
    }

    /* MAIN */
    main {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,.08);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .product {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
    }

    .price {
      font-weight: 700;
      color: var(--blue);
    }

    .muted {
      color: #6b7280;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      margin-bottom: 10px;
    }

    button.primary {
      background: var(--blue);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary:hover {
      background: var(--green);
    }

    footer {
      text-align: center;
      padding: 28px;
      color: #6b7280;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header>
  <img src="logo-impulso.png" alt="Impulso">
  <nav>
    <button onclick="showSection('market')">Inicio</button>
    <button onclick="showSection('sell')">Vender</button>
    <button onclick="showSection('about')">Acerca</button>
  </nav>
</header>

<!-- MAIN -->
<main>

  <!-- HERO -->
  <section class="hero">
    <h1>Impulsa tu proyecto</h1>
    <p>Soluciones reales para crecer</p>
  </section>

  <!-- MARKET -->
  <section id="market" class="grid">
    <div class="card">
      <h2>Filtros</h2>
      <label>Buscar</label>
      <input id="search" placeholder="Producto..." oninput="renderProducts()" />

      <label>Categoría</label>
      <select id="category" onchange="renderProducts()">
        <option value="">Todas</option>
        <option value="servicio">Servicio</option>
        <option value="producto">Producto</option>
      </select>
    </div>

    <div class="card">
      <h2>Productos</h2>
      <div id="products" class="products"></div>
    </div>
  </section>

  <!-- SELL -->
  <section id="sell" class="card" style="display:none">
    <h2>Quiero vender</h2>
    <p class="muted">Formulario de demostración (sin pagos reales).</p>

    <form>
      <label>Nombre del vendedor</label>
      <input type="text" required>

      <label>Correo de contacto</label>
      <input type="email" required>

      <label>Producto / Servicio</label>
      <input type="text" required>

      <label>Precio</label>
      <input type="number" required>

      <label>Descripción</label>
      <textarea rows="4" required></textarea>

      <button class="primary" type="submit">Enviar</button>
    </form>
  </section>

  <!-- ABOUT -->
  <section id="about" class="card" style="display:none">
    <h2>Acerca del proyecto</h2>
    <p>
      IMPULSO es un marketplace frontend de demostración para validar ideas
      de emprendimiento sin manejar dinero real.
    </p>
  </section>

</main>

<!-- FOOTER -->
<footer>
  © 2026 IMPULSO
</footer>

<!-- SCRIPT -->
<script>
  const state = {
    products: [
      { name: 'Diseño de logo', price: 500, cat: 'servicio', desc: 'Branding básico' },
      { name: 'Playera personalizada', price: 250, cat: 'producto', desc: 'Algodón premium' }
    ]
  };

  function showSection(id) {
    ['market', 'sell', 'about'].forEach(s => {
      document.getElementById(s).style.display = 'none';
    });
    document.getElementById(id).style.display = id === 'market' ? 'grid' : 'block';
  }

  function renderProducts() {
    const q = document.getElementById('search').value.toLowerCase();
    const c = document.getElementById('category').value;

    const list = state.products.filter(p =>
      (!q || p.name.toLowerCase().includes(q)) &&
      (!c || p.cat === c)
    );

    const el = document.getElementById('products');
    el.innerHTML = '';

    list.forEach(p => {
      const d = document.createElement('div');
      d.className = 'product';
      d.innerHTML = `
        <h4>${p.name}</h4>
        <p class="muted">${p.desc}</p>
        <p class="price">$${p.price}</p>
      `;
      el.appendChild(d);
    });
  }

  renderProducts();
</script>

</body>
</html>
