  <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>IMPULSO | Marketplace</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <header class="brand">
      <h1>IMPULSO</h1>
      <h2>Compra y vende en tiempo real</h2>
    </header>

    <!-- AUTH -->
    <section>
      <button id="btnLogin">Iniciar sesión</button>
      <button id="btnLogout" style="display:none;">Cerrar sesión</button>
      <a href="perfil.html">Mi perfil</a>
    </section>

    <hr>

    <!-- PUBLICAR PRODUCTO -->
    <section>
      <h3>Publicar producto</h3>
      <input id="prodTitulo" placeholder="Título del producto">
      <input id="prodPrecio" type="number" placeholder="Precio">
      <textarea id="prodDescripcion" placeholder="Descripción"></textarea>
      <button id="btnPublicarProducto">Publicar producto</button>
    </section>

    <hr>

    <!-- PUBLICAR SERVICIO -->
    <section>
      <h3>Publicar servicio</h3>
      <input id="servTitulo" placeholder="Título del servicio">
      <input id="servPrecio" type="number" placeholder="Precio">
      <textarea id="servDescripcion" placeholder="Descripción"></textarea>
      <button id="btnPublicarServicio">Publicar servicio</button>
    </section>

    <hr>

    <!-- LISTADOS -->
    <section>
      <h3>Productos</h3>
      <ul id="productos"></ul>
    </section>

    <section>
      <h3>Servicios</h3>
      <ul id="servicios"></ul>
    </section>
  </div>

  <!-- SCRIPTS -->
  <script type="module" src="./auth.js"></script>
  <script type="module" src="./products.js"></script>
  <script type="module" src="./services.js"></script>
</body>

</html>
