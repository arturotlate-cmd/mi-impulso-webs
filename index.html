  <script type="module">
    let currentChatProduct = null;
let chatUnsub = null;

// Abrir chat
window.openChat = (productId, seller) => {
  if (!currentUser) return alert("Inicia sesión");

  currentChatProduct = productId;
  document.getElementById("privateChat").style.display = "block";

  // Escuchar mensajes del producto
  if (chatUnsub) chatUnsub(); // cerrar chat anterior

  const chatRef = collection(db, "chats", productId, "messages");

  chatUnsub = onSnapshot(chatRef, (snap) => {
    privateChatBox.innerHTML = "";
    snap.forEach(doc => {
      const m = doc.data();
      privateChatBox.innerHTML += `<p><b>${m.user}:</b> ${m.msg}</p>`;
    });
  });
};

// Enviar mensaje privado
document.getElementById("sendPrivate").onclick = async () => {
  if (!currentChatProduct) return;

  await addDoc(collection(db, "chats", currentChatProduct, "messages"), {
    user: currentUser.displayName,
    uid: currentUser.uid,
    msg: privateMsg.value,
    time: Date.now()
  });

  privateMsg.value = "";
};

document.getElementById("loginBtn").onclick = async () => {
  const result = await signInWithPopup(auth, provider);

// ================= PUBLICAR PRODUCTO =================
document.getElementById("publishBtn").onclick = async () => {
  if (!currentUser) return alert("Inicia sesión");

  const name = pName.value;
  const desc = pDesc.value;
  const price = pPrice.value;
  const file = pImage.files[0];

  const imgRef = ref(storage, "products/" + Date.now());
  await uploadBytes(imgRef, file);
  const imgURL = await getDownloadURL(imgRef);

  await addDoc(collection(db, "products"), {
    name, desc, price, imgURL,
    user: currentUser.displayName
  });

  alert("Producto publicado");
};

// ================= MOSTRAR PRODUCTOS =================

document.getElementById("sendChat").onclick = async () => {

  await addDoc(collection(db, "chat"), {

};
