<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Producto | IMPULSO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <a href="products.html">← Volver</a>
</header>

<div class="container">
  <h1 id="titulo"></h1>
  <p id="descripcion"></p>
  <p id="precio"></p>

  <hr>

  <div id="chatSection" style="display:none;">
    <a id="btnChat" class="btn btn-primary">Abrir Chat</a>
  </div>
</div>

<script type="module" src="firebase.js"></script>
<script type="module">
import { db } from "./firebase.js";
import { getDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const params = new URLSearchParams(location.search);
const id = params.get("id");

if (!id) {
  alert("Producto inválido");
} else {
  const ref = doc(db, "productos", id);
  getDoc(ref).then(res => {
    const d = res.data();
    document.getElementById("titulo").textContent = d.titulo;
    document.getElementById("descripcion").textContent = d.descripcion;
    document.getElementById("precio").textContent = "$" + d.precio;

    document.getElementById("chatSection").style.display = "block";
    document.getElementById("btnChat").href = `chat.html?product=${id}`;
  });
}
</script>

</body>
</html>
