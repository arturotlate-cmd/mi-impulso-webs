<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productos | IMPULSO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html">← Inicio</a>
</header>

<div class="container">
  <h1>Productos publicados</h1>
  <ul id="productos"></ul>
</div>

<script type="module" src="firebase.js"></script>
<script type="module">

import { db } from "./firebase.js";
import { collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const lista = document.getElementById("productos");

const q = query(collection(db, "productos"), orderBy("fecha", "desc"));
onSnapshot(q, (snap) => {
  lista.innerHTML = "";
  snap.forEach(doc => {
    const d = doc.data();
    const id = doc.id;
    lista.innerHTML += `
      <li class="product-item">
        <a class="product-link" href="product.html?id=${id}">
          ${d.titulo} — $${d.precio}
        </a>
      </li>`;
  });
});

</script>

</body>
</html>
